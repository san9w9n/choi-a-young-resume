name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/therapist-portfolio-page-rc3vxu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          # Settings 에서 Pages 를 켜 두지 않았어도 이 단계가 대신 켜 줍니다.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          # 숨김 파일(.git, .github, .nojekyll)은 업로드에서 제외합니다.
          # Actions 배포는 Jekyll 을 거치지 않으므로 .nojekyll 이 필요 없고,
          # 포함시키면 .git 저장소까지 사이트에 공개됩니다.
          include-hidden-files: false
      - id: deployment
        uses: actions/deploy-pages@v5
